# Fly.io Configuration (`fly launch` / `fly deploy`)
app = "the-common-need-oak01"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  RAILS_ENV = "production"
  PORT = "8080"
  LOCAL_NODE_CODE = "#OAK-01"
  HOUSEHOLD_PII_ON_HUB_BYTES = "0"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/manifest.json"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
