apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: the-common-need-osrm
  annotations:
    run.googleapis.com/ingress: internal-and-cloud-load-balancing
    run.googleapis.com/description: "Self-Hosted OSRM Routing Engine for The Common Need Volunteer Courier PWA (#OAK-01)"
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "5"
    spec:
      containers:
        - name: osrm-backend
          image: osrm/osrm-backend:latest
          ports:
            - name: http1
              containerPort: 5000
          resources:
            limits:
              cpu: "2000m"
              memory: "4Gi"
