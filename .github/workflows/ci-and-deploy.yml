name: CI & Deploy — The Common Need Decidim PWA Suite

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  pages: write
  id-token: write

jobs:
  rspec-and-security-audit:
    name: RSpec & Zero-PII Security Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Ruby 3.4
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - name: Verify Ruby Syntax Across All Engines
        run: |
          ruby -e 'Dir["**/*.rb"].each { |f| system("ruby", "-c", f, out: File::NULL) || abort("Syntax error in #{f}") }; puts "Verified #{Dir["**/*.rb"].size} Ruby files"'

      - name: Run 74 RSpec Unit & 5-Role PWA System Specs
        run: |
          ruby -I gems/decidim-module-common_need/spec -r spec_helper -e 'Dir["gems/decidim-module-common_need/spec/**/*_spec.rb"].sort.each { |f| load f }'

  build-ghcr-container:
    name: Build & Push Docker Image (ghcr.io)
    needs: rspec-and-security-audit
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Decidim PWA Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/the-common-need-main:latest
            ghcr.io/${{ github.repository_owner }}/the-common-need-main:${{ github.sha }}

  deploy-github-pages-pwa:
    name: Deploy 5-Role PWA Preview to GitHub Pages
    needs: rspec-and-security-audit
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Upload PWA Artifact (public/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./public"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

  deploy-cloud-run-optional:
    name: Deploy to Google Cloud Run (When GCP_SA_KEY Secret Is Set)
    needs: build-ghcr-container
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_CLOUD_RUN == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: the-common-need-pwa
          region: us-west1
          source: .
          env_vars: |
            RAILS_ENV=production
            LOCAL_NODE_CODE=#OAK-01
            HOUSEHOLD_PII_ON_HUB_BYTES=0
