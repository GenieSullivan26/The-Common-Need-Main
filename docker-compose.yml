version: "3.9"

services:
  postgres:
    image: postgis/postgis:17-3.4
    container_name: common_need_postgis
    restart: unless-stopped
    environment:
      POSTGRES_USER: common_need
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-solidarity_local_only}
      POSTGRES_DB: the_common_need_production
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U common_need -d the_common_need_production"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: common_need_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  osrm:
    image: osrm/osrm-backend:latest
    container_name: common_need_osrm
    restart: unless-stopped
    command: ["osrm-routed", "--algorithm", "mld", "/data/norcal-latest.osrm"]
    volumes:
      - osrm_data:/data
    ports:
      - "5000:5000"

  photon:
    image: rtuszik/photon-docker:latest
    container_name: common_need_photon
    restart: unless-stopped
    volumes:
      - photon_data:/photon/photon_data
    ports:
      - "2322:2322"

  ollama:
    image: ollama/ollama:latest
    container_name: common_need_ollama_local
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"

  decidim:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: common_need_decidim_pwa
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      osrm:
        condition: service_started
    environment:
      RAILS_ENV: production
      PORT: 8080
      DATABASE_URL: postgis://common_need:${POSTGRES_PASSWORD:-solidarity_local_only}@postgres:5432/the_common_need_production
      REDIS_URL: redis://redis:6379/1
      LOCAL_OSRM_URL: http://osrm:5000
      PHOTON_GEOCODER_HOST: http://photon:2322
      LOCAL_OLLAMA_URL: http://127.0.0.1:11434/api/generate
      LOCAL_NODE_CODE: "#OAK-01"
      HOUSEHOLD_PII_ON_HUB_BYTES: "0"
    ports:
      - "8080:8080"

volumes:
  postgres_data:
  redis_data:
  osrm_data:
  photon_data:
  ollama_data:
